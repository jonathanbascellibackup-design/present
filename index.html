<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Il mio sito</title>
    <style>
        .scheda-prodotto {
            width: 300px;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            margin: 20px auto;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .scheda-prodotto img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .bottone-amazon {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background-color: #ffd814;
            color: #0f1111;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            border: 1px solid #fcd200;
        }

        .bottone-amazon:hover {
            background-color: #f7ca00;
        }
    </style>
</head>
<body>

    <div class="scheda-prodotto">
        <img src="https://github.com/jonathanbascellibackup-design/present/blob/main/Screenshot%202026-11-12%20alle%2021.41.53.png" alt="Nome del prodotto">
        <h3>Titolo del prodotto</h3>
        <p>Breve descrizione dell'articolo.</p>
        <a href="https://www.amazon.it/gp/product/B0DPB1HVCL/ref=ox_sc_act_image_3?smid=A7Q3FW5A194LO&psc=1" target="_blank" rel="noopener noreferrer" class="bottone-amazon">
            Vedi su Amazon
        </a>
    </div>

</body>
</html>
